<!doctype html>
<html lang="en">
<head>
    <title>Smart To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">📝 Smart To-Do List</h3>
        </div>
        <div class="card-body">
            <form action="/add" method="post" class="row g-2 mb-4">
                <div class="col-md-5">
                    <input type="text" name="task" class="form-control" placeholder="Enter task" required>
                </div>
                <div class="col-md-2">
                    <select name="priority" class="form-select">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="date" name="due" class="form-control">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Add Task</button>
                </div>
            </form>

            {% if tasks %}
            <ul class="list-group">
                {% for task in tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-start">
                        <div class="ms-2 me-auto">
                            <div class="fw-bold {% if task.completed %}text-decoration-line-through text-muted{% endif %}">
                                {{ task.text }}
                            </div>
                            <small>
                                Priority:
                                <span class="badge bg-{% if task.priority == 'High' %}danger{% elif task.priority == 'Low' %}secondary{% else %}warning text-dark{% endif %}">
                                    {{ task.priority }}
                                </span>
                                {% if task.due %} | Due: {{ task.due }}{% endif %}
                            </small>
                        </div>
                        <div>
                            {% if not task.completed %}
                                <a href="/complete/{{ loop.index0 }}" class="btn btn-sm btn-outline-success me-2">✓</a>
                            {% endif %}
                            <a href="/delete/{{ loop.index0 }}" class="btn btn-sm btn-outline-danger">🗑</a>
                        </div>
                    </li>
                {% endfor %}
            </ul>
            {% else %}
                <p class="text-muted">No tasks yet. Add one above!</p>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
